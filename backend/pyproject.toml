[project]
name = "candidate-screening-agent"
version = "0.1.0"
description = "AI screening agent for delivery-driver applicants, with a recruiter tool."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "elevenlabs>=2.74.1",
    "fastapi>=0.162",
    # Signs the recruiter's session cookie: Starlette's SessionMiddleware imports it, and FastAPI doesn't install it.
    "itsdangerous>=2.2",
    "logfire[fastapi,sqlalchemy]>=5.3",
    "mcp>=2.3,<3",
    "pydantic-ai-slim[anthropic,google,logfire,openai]>=2.61,<3",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    # <2.1 because opentelemetry-instrumentation-sqlalchemy (behind logfire) only supports <2.1 so far.
    "sqlalchemy[asyncio]>=2.0.55,<2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "ipdb>=0.13.13",
    "pre-commit==4.7.0",
    "pytest>=8.4",
    "ruff>=0.14",
    "ty==0.0.91",
]
evals = [
    "pydantic-evals>=2.61,<3",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "screening"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.logfire]
# Tests and one-off scripts run without logfire.configure(); spans are simply not recorded there.
ignore_no_config = true
