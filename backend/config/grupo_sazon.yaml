# Fixed messages. Each template is a list of bubbles; {placeholders} are filled by code.
# Wording is gender-neutral about the candidate in every locale.
templates:
  first_message:
    es-ES:
      - "Hola, {first_name} 👋\nSoy {persona}, el asistente virtual de {client}.\n¿Te hago unas preguntas rápidas sobre tu solicitud para repartir en {city}? Son unos 3 minutos."
    es-MX:
      - "Hola, {first_name} 👋\nSoy {persona}, el asistente virtual de {client}.\n¿Te puedo hacer unas preguntas rápidas sobre tu solicitud para repartir en {city}? Son unos 3 minutos."
    en:
      - "Hi {first_name} 👋\nI'm {persona}, {client}'s virtual assistant.\nCan I ask you a few quick questions about your application to deliver in {city}? It takes about 3 minutes."
  intro:
    es-ES:
      - "Perfecto, empezamos.\nSoy un asistente virtual: te haré unas preguntas cortas y el equipo de selección verá tus respuestas."
      - "Primero, ¿tu nombre completo es {full_name}?"
    es-MX:
      - "Perfecto, empezamos.\nSoy un asistente virtual: te haré unas preguntas cortas y el equipo de reclutamiento verá tus respuestas."
      - "Primero, ¿tu nombre completo es {full_name}?"
    en:
      - "Great, let's start.\nI'm a virtual assistant: I'll ask a few short questions, and the hiring team will see your answers."
      - "First, is your full name {full_name}?"
  intro_direct:
    es-ES:
      - "Hola 👋\nSoy {persona}, el asistente virtual de {client}. Te haré unas preguntas cortas sobre tu solicitud (unos 3 minutos) y el equipo de selección verá tus respuestas."
      - "Primero, ¿tu nombre completo es {full_name}?"
    es-MX:
      - "Hola 👋\nSoy {persona}, el asistente virtual de {client}. Te haré unas preguntas cortas sobre tu solicitud (unos 3 minutos) y el equipo de reclutamiento verá tus respuestas."
      - "Primero, ¿tu nombre completo es {full_name}?"
    en:
      - "Hi 👋\nI'm {persona}, {client}'s virtual assistant. I'll ask a few short questions about your application (about 3 minutes), and the hiring team will see your answers."
      - "First, is your full name {full_name}?"
  recap:
    es-ES:
      - "Repasamos:\n• Nombre: {full_name}\n• Carnet de conducir: {license}\n• Zona: {area}\n• Disponibilidad: {availability}\n• Horario: {schedule}\n• Experiencia: {experience}\n• Inicio: {start_date}\n¿Está todo bien?"
    es-MX:
      - "Repasamos:\n• Nombre: {full_name}\n• Licencia de manejo: {license}\n• Zona: {area}\n• Disponibilidad: {availability}\n• Horario: {schedule}\n• Experiencia: {experience}\n• Inicio: {start_date}\n¿Todo está correcto?"
    en:
      - "Quick recap:\n• Name: {full_name}\n• Driving license: {license}\n• Area: {area}\n• Availability: {availability}\n• Schedule: {schedule}\n• Experience: {experience}\n• Start: {start_date}\nIs everything right?"
  close_qualified:
    es-ES:
      - "¡Listo, {first_name}!\nTu perfil cumple con los requisitos."
      - "El equipo de selección te contactará pronto para el siguiente paso. ¡Gracias!"
    es-MX:
      - "¡Listo, {first_name}!\nTu perfil cumple con los requisitos."
      - "El equipo de reclutamiento te contactará pronto para el siguiente paso. ¡Gracias!"
    en:
      - "All set, {first_name}!\nYour profile meets the requirements."
      - "The hiring team will contact you soon about the next step. Thank you!"
  close_not_qualified_license:
    es-ES:
      - "Gracias, {first_name}.\nEste puesto requiere carnet de conducir en vigor, así que por ahora no podemos seguir."
      - "Cuando lo tengas, vuelve a escribirnos.\nSi prefieres que lo revise una persona, dímelo."
      - "¿Te avisamos si hay otros puestos en {client}?"
    es-MX:
      - "Gracias, {first_name}.\nEste puesto requiere licencia de manejo vigente, así que por ahora no podemos seguir."
      - "Cuando la tengas, vuelve a escribirnos.\nSi prefieres que lo revise una persona, dímelo."
      - "¿Te avisamos si hay otras vacantes en {client}?"
    en:
      - "Thanks, {first_name}.\nThis role requires a valid driving license, so we can't continue for now."
      - "Once you have one, write to us again.\nIf you'd rather a person reviewed this, just tell me."
      - "Shall we let you know about other roles at {client}?"
  close_not_qualified_area:
    es-ES:
      - "Gracias, {first_name}.\nAhora mismo no repartimos en tu zona, así que no podemos seguir con esta solicitud."
      - "Si prefieres que lo revise una persona, dímelo."
      - "¿Te avisamos si abrimos en tu zona o hay otros puestos?"
    es-MX:
      - "Gracias, {first_name}.\nPor ahora no tenemos reparto en tu zona, así que no podemos seguir con esta solicitud."
      - "Si prefieres que lo revise una persona, dímelo."
      - "¿Te avisamos si abrimos en tu zona o hay otras vacantes?"
    en:
      - "Thanks, {first_name}.\nWe don't deliver in your area right now, so we can't continue with this application."
      - "If you'd rather a person reviewed this, just tell me."
      - "Shall we let you know if we open in your area or have other roles?"
  close_review:
    es-ES:
      - "Gracias, {first_name}. Ya tengo todo lo necesario."
      - "Una persona del equipo revisará tu solicitud y te escribirá por aquí."
    es-MX:
      - "Gracias, {first_name}. Ya tengo todo lo que necesito."
      - "Una persona del equipo revisará tu solicitud y te escribirá por aquí."
    en:
      - "Thanks, {first_name}. I have everything I need."
      - "A person from the team will review your application and write to you here."
  close_ended:
    es-ES:
      - "Voy a terminar la conversación aquí. Una persona del equipo revisará tu solicitud."
    es-MX:
      - "Voy a terminar la conversación aquí. Una persona del equipo revisará tu solicitud."
    en:
      - "I'll end the conversation here. A person from the team will review your application."
  withdrawn:
    es-ES:
      - "Entendido, {first_name}. No te escribiremos más sobre esta solicitud. ¡Mucha suerte!"
    es-MX:
      - "Entendido, {first_name}. Ya no te escribiremos sobre esta solicitud. ¡Mucho éxito!"
    en:
      - "Understood, {first_name}. We won't message you again about this application. Best of luck!"
  wrong_person:
    es-ES:
      - "Disculpa la molestia. No volveremos a escribir a este número."
    es-MX:
      - "Disculpa la molestia. No volveremos a escribir a este número."
    en:
      - "Sorry for the trouble. We won't message this number again."
  talent_pool_yes:
    es-ES:
      - "¡Hecho! Te avisaremos. Gracias, {first_name}."
    es-MX:
      - "¡Listo! Te avisaremos. Gracias, {first_name}."
    en:
      - "Done! We'll let you know. Thanks, {first_name}."
  talent_pool_no:
    es-ES:
      - "Entendido. ¡Gracias por tu tiempo, {first_name}!"
    es-MX:
      - "Entendido. ¡Gracias por tu tiempo, {first_name}!"
    en:
      - "Understood. Thanks for your time, {first_name}!"
  reminder_not_started:
    es-ES:
      - "Hola, {first_name}. ¿Seguimos con tu solicitud para repartir en {city}? Son solo 3 minutos."
    es-MX:
      - "Hola, {first_name}. ¿Seguimos con tu solicitud para repartir en {city}? Son solo 3 minutos."
    en:
      - "Hi {first_name}. Shall we continue with your application to deliver in {city}? It only takes 3 minutes."
  reminder_in_progress:
    es-ES:
      - "Hola, {first_name}. Nos quedamos en {stage}. ¿Seguimos?"
    es-MX:
      - "Hola, {first_name}. Nos quedamos en {stage}. ¿Seguimos?"
    en:
      - "Hi {first_name}. We stopped at {stage}. Shall we continue?"
  failure:
    es-ES:
      - "Dame un momento, por favor."
    es-MX:
      - "Dame un momento, por favor."
    en:
      - "Give me a moment, please."
