# Canonical delivery platforms and the spellings candidates use. Anything else is kept as given.
platforms:
  Glovo: [glovo]
  Uber Eats: [uber eats, ubereats, uber]
  Just Eat: [just eat, justeat]
  Deliveroo: [deliveroo]
  Rappi: [rappi]
  DiDi Food: [didi food, didi]
  Stuart: [stuart]
  Amazon Flex: [amazon flex, amazon]

