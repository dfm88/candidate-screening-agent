# Grupo Sazón client configuration.
# SYNTHETIC DATA: locations, postal-code areas and place names are plausible fixtures for the demo, not the
# client's real network (the brief gives none). Postal prefixes and places are real geography, simplified.

client_name: Grupo Sazón
persona_name: Sazi
synthetic: true
max_tries: 2

# ISO 8601 durations.
timings:
  reminders_not_started: [PT4H, P1D]
  reminders_in_progress: [PT2H, P1D]
  abandon_after: P3D
  quiet_hours: {start: "21:00", end: "09:00"}

# A location is a restaurant. Its service area is a set of postal-code prefixes; `places` maps the
# neighbourhood, town or colonia names candidates actually use to a prefix inside that area.
locations:
  # --- Spain ---
  - id: es-mad-chamberi
    name: Madrid Chamberí
    country: ES
    city: Madrid
    timezone: Europe/Madrid
    postal_prefixes: ["28003", "28004", "28010", "28015"]
    places:
      Chamberí: "28010"
      Malasaña: "28004"
      Argüelles: "28015"
      Ríos Rosas: "28003"
  - id: es-mad-getafe
    name: Getafe
    country: ES
    city: Getafe
    timezone: Europe/Madrid
    postal_prefixes: ["2890"]
    places:
