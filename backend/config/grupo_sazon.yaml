# Job facts the agent may share. SYNTHETIC, like the locations: placeholders for the client's real FAQ.
# Written in English; the agent answers in the candidate's language and must not go beyond these answers.
faq:
  - question: How much does it pay?
    answer: >-
      Spain: from 9.80 EUR gross per hour, plus 0.50 EUR per delivery; full-time is around 1,450 EUR gross per
      month. Mexico: from 320 MXN per day plus 12 MXN per delivery. Tips are 100% for the driver in both countries.
  - question: Do I need my own vehicle?
    answer: >-
      No. Grupo Sazón provides an electric scooter, a helmet and a thermal bag. Drivers who prefer their own
      motorbike get a fuel allowance.
  - question: What kind of contract is it?
    answer: >-
      An employment contract with Grupo Sazón (not freelance), with social security from day one. A 2-month
      trial period applies.
  - question: What are the shifts?
    answer: >-
      Shifts cover the restaurant's opening hours, Monday to Sunday, and are busiest at lunch and dinner.
      Part-time and weekend-only contracts exist. The schedule is agreed with the restaurant manager, with the
      candidate's preference in mind.
  - question: Which licenses are accepted?
    answer: >-
      A car or motorbike license (in Spain B, AM, A1, A2 or A), valid today for driving in the country where you
      work. The hiring team checks a license from another country.
  - question: Is there training?
    answer: >-
      Yes: a paid half-day induction on safety, the scooter and the delivery app before the first shift.
  - question: What happens after this chat?
    answer: >-
      Recruiters review the answers. Qualified candidates are contacted for a short call with the team, usually
      within 2 working days.
  - question: Is there a uniform?
    answer: Yes, Grupo Sazón provides the uniform and rain gear.

# The word each country uses for the same thing. The agent writes Spanish with the country of work's terms only;
# the evals flag the other country's terms. One row per concept, every country filled in.
regional_terms:
  - {ES: carnet de conducir, MX: licencia de manejo}
  - {ES: conducir, MX: manejar}
  - {ES: móvil, MX: celular}
  - {ES: coche, MX: carro}
  - {ES: jornada completa, MX: tiempo completo}
  - {ES: media jornada, MX: medio tiempo}
  - {ES: equipo de selección, MX: equipo de reclutamiento}

# Quick-reply labels, and the stages a reminder names: the next field to ask, or the recap.
labels:
  es-ES:
    start: Empezar
    not_interested: No me interesa
    field_full_name: tu nombre
    field_license: el carnet de conducir
    field_service_area: tu zona
    field_availability: tu disponibilidad
    field_schedule: tu horario
    field_experience: tu experiencia
    field_start_date: la fecha de inicio
    stage_recap: el resumen de tus respuestas
  es-MX:
    start: Empezar
    not_interested: No me interesa
    field_full_name: tu nombre
    field_license: la licencia de manejo
    field_service_area: tu zona
    field_availability: tu disponibilidad
    field_schedule: tu horario
    field_experience: tu experiencia
    field_start_date: la fecha de inicio
    stage_recap: el resumen de tus respuestas
  en:
