    not_interested: Not interested
    field_full_name: your name
    field_license: your driving license
    field_service_area: your area
    field_availability: your availability
    field_schedule: your schedule
    field_experience: your experience
    field_start_date: your start date
    stage_recap: the recap of your answers

# Fixed messages, only where the channel requires them: the first message, the reminders and the recruiter's decision
# (which can come days later) fall outside WhatsApp's 24-hour window, and the failure notice is sent when the model
# itself is failing.
# Each template is a list of bubbles; {placeholders} are filled by code. Gender-neutral in every locale.
templates:
  first_message:
    es-ES:
      - "Hola, {first_name} 👋\nSoy {persona}, el asistente virtual de {client}.\n¿Te hago unas preguntas rápidas sobre tu solicitud para repartir en {city}? Son unos 3 minutos."
    es-MX:
      - "Hola, {first_name} 👋\nSoy {persona}, el asistente virtual de {client}.\n¿Te puedo hacer unas preguntas rápidas sobre tu solicitud para repartir en {city}? Son unos 3 minutos."
    en:
      - "Hi {first_name} 👋\nI'm {persona}, {client}'s virtual assistant.\nCan I ask you a few quick questions about your application to deliver in {city}? It takes about 3 minutes."
  reminder_not_started:
    es-ES:
      - "Hola, {first_name}. ¿Seguimos con tu solicitud para repartir en {city}? Son solo 3 minutos."
    es-MX:
      - "Hola, {first_name}. ¿Seguimos con tu solicitud para repartir en {city}? Son solo 3 minutos."
    en:
      - "Hi {first_name}. Shall we continue with your application to deliver in {city}? It only takes 3 minutes."
  reminder_in_progress:
    es-ES:
      - "Hola, {first_name}. Nos quedamos en {stage}. ¿Seguimos?"
    es-MX:
      - "Hola, {first_name}. Nos quedamos en {stage}. ¿Seguimos?"
    en:
      - "Hi {first_name}. We stopped at {stage}. Shall we continue?"
  # The recruiter's decision, keyed decision_{outcome}. The recruiter's note stays internal.
  decision_qualified:
    es-ES:
      - "Hola, {first_name}. El equipo de selección ha revisado tu solicitud para repartir en {city} y tu perfil encaja.\nTe contactaremos pronto para el siguiente paso."
    es-MX:
      - "Hola, {first_name}. El equipo de reclutamiento revisó tu solicitud para repartir en {city} y tu perfil encaja.\nTe contactaremos pronto para el siguiente paso."
    en:
      - "Hi {first_name}. The hiring team has reviewed your application to deliver in {city}, and your profile is a fit.\nWe'll contact you soon about the next step."
  decision_not_qualified:
    es-ES:
      - "Hola, {first_name}. El equipo de selección ha revisado tu solicitud para repartir en {city} y, por ahora, no podemos seguir adelante.\nGracias por tu tiempo. Si tienes alguna pregunta, escríbenos aquí."
    es-MX:
      - "Hola, {first_name}. El equipo de reclutamiento revisó tu solicitud para repartir en {city} y, por ahora, no podemos seguir adelante.\nGracias por tu tiempo. Si tienes alguna pregunta, escríbenos aquí."
    en:
      - "Hi {first_name}. The hiring team has reviewed your application to deliver in {city}, and we can't move forward for now.\nThanks for your time. If you have any questions, write to us here."
  failure:
    es-ES:
      - "Dame un momento, por favor."
    es-MX:
      - "Dame un momento, por favor."
    en:
      - "Give me a moment, please."
