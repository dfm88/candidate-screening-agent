# Eval cases: synthetic candidates, in both countries. The profile is for the simulator (in English); metadata
# is what the screening should end with. All clocks are Wednesday 21 October 2026, 16:00 UTC: 18:00 in Spain,
# 10:00 in Mexico. Don't copy these exchanges into the prompt as examples (AGENTS.md: changing the prompt).
# A case with a `script` replays fixed candidate messages (an observed failure) instead of the simulator, and is
# checked on the state after its last message. Each scripted turn declares the fields its messages give an answer for
# (`provides`, as the simulator labels its own): a field saved before any turn provides it is an invented answer.
cases:
  - name: scripted_mx_foreign_license_not_a_no
    inputs:
      vacancy: mx-mty-centro
      name_on_application: Luis Alberto Pérez Gómez
      application_language: es
      now: 2026-10-21T16:00:00Z
      profile: |
        Luis, Colombian, living in Monterrey, with a Colombian license whose validity in Mexico he doesn't know.
        Replayed from a Gemini 3.5 Flash-Lite run (2026-10-24) that saved license=no after a leading question.
      script:
        - messages: ["Hola, sí, claro. Pregúntame 😊"]
        - messages: ["Sí, mi nombre completo es Luis Alberto Pérez Gómez."]
          provides: [full_name]
        - messages: ["Tengo licencia de Colombia, pero no estoy seguro si sirve para manejar en México; nunca lo he revisado."]
          provides: [license]
        - messages: ["No, por ahora solo tengo la licencia de Colombia. No estoy seguro si sirve en México; nunca lo he revisado."]
          provides: [license]
    metadata:
      tags: [mx, scripted, unclear]
      status: in_progress
      unclear: [license]
      final_language: es
      answers:
        full_name: Luis Alberto Pérez Gómez
        license: null

  - name: scripted_es_reply_after_decision
    inputs:
      vacancy: es-mad-chamberi
      name_on_application: Marta Ruiz Gómez
      application_language: es
      now: 2026-10-21T16:00:00Z
      profile: |
        Marta asks for a person instead of the questions; a recruiter then decides she qualifies, and she asks when
        they'll call ("genial! y cuándo me llamáis?"), then mentions her license expired last month. Replayed from a
        terra run in the browser (2026-10-25): after the decision the agent still said the team would review her
        application, because the context block only showed the rules' outcome.
      script:
        - messages: ["Empezar"]
        - messages: ["sí, soy yo. pero prefiero hablar con una persona del equipo"]
          provides: [full_name]
        - messages: ["no gracias, prefiero esperar a que me escriban"]
        - messages: ["genial! y cuándo me llamáis?"]
        - messages: ["ah por cierto, el carnet lo tengo caducado desde el mes pasado"]
          provides: [license]
      decision: {after_turn: 3, outcome: qualified}
    metadata:
      tags: [es, scripted, decision]
      status: completed
      outcome: needs_human_review
      review_reasons: [human_requested, knockout_changed]
      final_language: es
      answers:
        full_name: Marta Ruiz Gómez
        license: "no"

  # The four place cases: a place the lookup misses comes back with the known places (2026-10-25). The candidate's
  # words are not the ones in the config, and none of them is a replay of a failure: they are held-out variants.
  # `location_id: not saved` is the evaluator's marker for "no area saved yet".
  - name: scripted_es_place_with_extra_words
    inputs:
      vacancy: es-mad-chamberi
      name_on_application: Elena Vidal Prieto
      application_language: es
      now: 2026-10-21T16:00:00Z
      profile: |
        Elena answers the postal code question with the area she lives in, wrapped in extra words ("la zona de
        Ríos Rosas"), which the lookup doesn't match as written.
      script:
        - messages: ["Empezar"]
        - messages: ["sí, soy yo"]
          provides: [full_name]
        - messages: ["sí, tengo el carnet B en vigor"]
          provides: [license]
        - messages: ["vivo por la zona de Ríos Rosas"]
          provides: [service_area]
    metadata:
      tags: [es, scripted, place]
      status: in_progress
      final_language: es
      answers:
        full_name: Elena Vidal Prieto
        license: "yes"
        location_id: es-mad-chamberi

