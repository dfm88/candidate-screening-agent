  # The service area, whatever the candidate says (2026-10-26). The first replays a call: asked for the postal code,
  # the candidate named the place with its city; the agent saved nothing and asked for the code, read "8001" back, and
  # saved "08011" from "eight, zero, zero, one, one" unconfirmed: a knockout. The rest are held-out variants in other
  # words: a place with its city, a city with no restaurant, a misspelled place, codes that can't exist, a code outside
  # every area before and after it's confirmed, and a code in another of our areas.
  - name: scripted_en_call_place_with_city_voice
    inputs:
      vacancy: es-bcn-gracia
      name_on_application: ddiego
      application_language: en
      now: 2026-10-21T16:00:00Z
      medium: voice
      profile: |
        Diego, Italian, living in Gràcia, Barcelona, with an Italian license valid in Spain. The call as it happened,
        up to his answer to the postal code question: the place with its city, which is saved.
      script:
        - messages: ["Go ahead."]
        - messages: ["Yeah."]
          provides: [full_name]
        - messages: ["Diego Rigoni."]
          provides: [full_name]
        - messages: ["I have, uh, an Italian, uh, driving licence."]
          provides: [license]
        - messages: ["Yeah."]
          provides: [license]
        - messages: ["Barcelona, Gràcia."]
          provides: [service_area]
    metadata:
      tags: [es, scripted, place, voice]
      status: in_progress
      final_language: en
      answers:
        full_name: Diego Rigoni
        license: "yes"
        location_id: es-bcn-gracia

  - name: scripted_en_call_place_with_city_then_spoken_code_voice
    inputs:
      vacancy: es-bcn-gracia
      name_on_application: ddiego
      application_language: en
      now: 2026-10-21T16:00:00Z
      medium: voice
      profile: |
        Diego, Italian, living in Gràcia, Barcelona, with an Italian license valid in Spain. The whole call as it
        happened. Once the place is saved, his later lines answer other questions; whatever they're read as, nothing
        ends the screening: a code he gives replaces the place only once confirmed, and then he's asked which is right.
      script:
        - messages: ["Go ahead."]
        - messages: ["Yeah."]
          provides: [full_name]
        - messages: ["Diego Rigoni."]
          provides: [full_name]
        - messages: ["I have, uh, an Italian, uh, driving licence."]
          provides: [license]
        - messages: ["Yeah."]
          provides: [license]
        - messages: ["Barcelona, Gràcia."]
          provides: [service_area]
        - messages: ["I don't know."]
        - messages: ["8001."]
          provides: [service_area]
        - messages: ["Yeah."]
        - messages: ["Yeah, eight, zero, zero, one, one."]
          provides: [service_area]
    metadata:
      tags: [es, scripted, place, voice]
      status: in_progress
      unclear: null
      final_language: en
      answers:
        full_name: Diego Rigoni
        license: "yes"

